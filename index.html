
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FAST MIND SOLUTION | ERP</title>
<style>
:root {
  --navy:#071426;
  --panel:#10233d;
  --gold:#d9ad50;
  --white:#f4f6fa;
  --muted:#aab6c8;
  --border:#263c58;
}
*{box-sizing:border-box}
body{
  margin:0;
  background:var(--navy);
  color:var(--white);
  font-family:Arial,sans-serif;
}
button,input{font:inherit}
.login-wrap{
  min-height:100vh;
  display:grid;
  place-items:center;
  padding:20px;
}
.login-card{
  width:100%;
  max-width:410px;
  padding:35px 28px;
  background:var(--panel);
  border:1px solid var(--border);
  border-radius:18px;
  text-align:center;
  box-shadow:0 15px 50px #0005;
}
.logo{
  color:var(--gold);
  font-size:27px;
  font-weight:800;
  letter-spacing:1px;
}
.subtitle{color:var(--muted);margin:9px 0 28px}
input{
  width:100%;
  padding:15px;
  margin:9px 0;
  border-radius:9px;
  border:1px solid var(--border);
  background:#08172a;
  color:white;
  outline:none;
}
input:focus{border-color:var(--gold)}
.gold-btn{
  width:100%;
  padding:14px;
  margin-top:14px;
  border:0;
  border-radius:9px;
  background:var(--gold);
  color:#101827;
  font-weight:bold;
  cursor:pointer;
}
#message{color:#ffb6a8;font-size:13px;min-height:20px}
#app{display:none;min-height:100vh}
.sidebar{
  position:fixed;
  top:0;bottom:0;left:0;
  width:245px;
  padding:24px 16px;
  background:#091a30;
  border-right:1px solid var(--border);
  overflow-y:auto;
}
.brand{font-size:21px;color:var(--gold);font-weight:bold;margin:5px 8px 28px}
.nav-btn{
  width:100%;
  display:block;
  text-align:left;
  padding:13px 14px;
  margin:4px 0;
  border:0;
  border-radius:8px;
  color:#dce4f0;
  background:transparent;
  cursor:pointer;
}
.nav-btn:hover,.nav-btn.active{
  background:#1b304c;
  color:var(--gold);
}
.main{margin-left:245px;padding:28px}
.topbar{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:15px;
  flex-wrap:wrap;
  border-bottom:1px solid var(--border);
  padding-bottom:20px;
}
h1{font-size:25px;margin:0}
.gold{color:var(--gold)}
.small{color:var(--muted);font-size:13px}
.logout{
  background:transparent;
  color:var(--gold);
  border:1px solid var(--gold);
  border-radius:8px;
  padding:10px 16px;
  cursor:pointer;
}
.cards{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(180px,1fr));
  gap:16px;
  margin:25px 0;
}
.card{
  background:var(--panel);
  border:1px solid var(--border);
  border-radius:13px;
  padding:20px;
}
.card h3{font-size:14px;color:var(--muted);font-weight:normal}
.card strong{font-size:25px;color:var(--gold)}
.welcome{
  background:linear-gradient(110deg,#132b49,#10213a);
  border:1px solid var(--border);
  padding:25px;
  border-radius:14px;
}
.module-grid{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(145px,1fr));
  gap:13px;
  margin-top:20px;
}
.module{
  padding:20px 12px;
  text-align:center;
  background:var(--panel);
  border:1px solid var(--border);
  border-radius:12px;
  color:var(--white);
  cursor:pointer;
}
.module:hover{border-color:var(--gold);color:var(--gold)}
#pageMessage{color:var(--muted);margin-top:20px}
@media(max-width:700px){
  .sidebar{
    position:relative;
    width:100%;
    height:auto;
    padding:15px;
  }
  .sidebar nav{
    display:grid;
    grid-template-columns:repeat(2,1fr);
    gap:3px;
  }
  .brand{margin-bottom:12px}
  .main{margin-left:0;padding:18px}
  h1{font-size:21px}
}
</style>
</head>
<body>

<section class="login-wrap" id="loginScreen">
  <div class="login-card">
    <div class="logo">FAST MIND</div>
    <h2 class="gold">SOLUTION ERP</h2>
    <p class="subtitle">Secure Owner Login</p>
    <form id="loginForm">
      <input id="email" type="email" placeholder="Owner Email" required>
      <input id="password" type="password" placeholder="Password" required>
      <button class="gold-btn" type="submit">LOGIN</button>
    </form>
    <p id="message"></p>
    <p class="small">Authorized accounts only</p>
  </div>
</section>

<div id="app">
  <aside class="sidebar">
    <div class="brand">FAST MIND ERP</div>
    <nav id="navigation">
      <button class="nav-btn active" data-page="Dashboard">▦ Dashboard</button>
      <button class="nav-btn" data-page="Inventory">▣ Inventory</button>
      <button class="nav-btn" data-page="Sales">↗ Sales</button>
      <button class="nav-btn" data-page="Purchases">↙ Purchases</button>
      <button class="nav-btn" data-page="Customers">♙ Customers</button>
      <button class="nav-btn" data-page="Suppliers">♧ Suppliers</button>
      <button class="nav-btn" data-page="Finance">◈ Finance</button>
      <button class="nav-btn" data-page="Expenses">▤ Expenses</button>
      <button class="nav-btn" data-page="HR & Payroll">♧ HR & Payroll</button>
      <button class="nav-btn" data-page="Reports">▥ Reports</button>
      <button class="nav-btn" data-page="Settings">⚙ Settings</button>
      <button class="nav-btn" data-page="Super Admin">♛ Super Admin</button>
    </nav>
  </aside>

  <main class="main">
    <header class="topbar">
      <div>
        <h1 id="pageTitle">Dashboard</h1>
        <p class="small">FAST MIND SOLUTION • ERP SYSTEM</p>
      </div>
      <button class="logout" id="logoutBtn">Logout</button>
    </header>

    <section id="dashboardContent">
      <div class="welcome">
        <h2>Welcome to <span class="gold">FAST MIND SOLUTION</span></h2>
        <p class="small">Your business management workspace</p>
      </div>
      <div class="cards">
        <div class="card"><h3>Total Sales</h3><strong>—</strong></div>
        <div class="card"><h3>Total Purchases</h3><strong>—</strong></div>
        <div class="card"><h3>Stock Items</h3><strong>—</strong></div>
        <div class="card"><h3>Net Balance</h3><strong>—</strong></div>
      </div>
      <h2>ERP Modules</h2>
      <div class="module-grid" id="moduleGrid"></div>
    </section>
    <p id="pageMessage"></p>
  </main>
</div>

<script type="module">
import { initializeApp } from
"https://www.gstatic.com/firebasejs/11.10.0/firebase-app.js";

import {
  getAuth,
  signInWithEmailAndPassword,
  onAuthStateChanged,
  signOut
} from
"https://www.gstatic.com/firebasejs/11.10.0/firebase-auth.js";

const firebaseConfig = {
  apiKey: "AIzaSyAIYhnQBwVB4nicSwKWzwDvaJQVQvibnMU",
  authDomain: "fast-mind-solution.firebaseapp.com",
  projectId: "fast-mind-solution",
  storageBucket: "fast-mind-solution.firebasestorage.app",
  messagingSenderId: "505740976965",
  appId: "1:505740976965:web:12f6e5dfab4f6b66ff542c",
  measurementId: "G-4ZJNWHD59Y"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);

const loginScreen = document.getElementById("loginScreen");
const appScreen = document.getElementById("app");
const message = document.getElementById("message");

document.getElementById("loginForm").addEventListener("submit", async (e) => {
  e.preventDefault();
  message.textContent = "Signing in...";

  const email = document.getElementById("email").value.trim();
  const password = document.getElementById("password").value;

  try {
    await signInWithEmailAndPassword(auth, email, password);
    message.textContent = "";
  } catch (error) {
    message.textContent = "Login failed. Check your email and password.";
    console.error(error);
  }
});

onAuthStateChanged(auth, (user) => {
  if (user) {
    loginScreen.style.display = "none";
    appScreen.style.display = "block";
  } else {
    loginScreen.style.display = "grid";
    appScreen.style.display = "none";
  }
});

document.getElementById("logoutBtn").addEventListener("click", async () => {
  await signOut(auth);
});

const modules = [
  "Inventory","Sales","Purchases","Customers","Suppliers",
  "Finance","Expenses","HR & Payroll","CRM","Production",
  "Procurement","Projects","Assets","Reports","Settings",
  "Super Admin"
];

const moduleGrid = document.getElementById("moduleGrid");
modules.forEach(name => {
  const button = document.createElement("button");
  button.className = "module";
  button.textContent = name;
  button.addEventListener("click", () => showPage(name));
  moduleGrid.appendChild(button);
});

function showPage(name) {
  document.getElementById("pageTitle").textContent = name;
  document.getElementById("dashboardContent").style.display =
    name === "Dashboard" ? "block" : "none";
  document.getElementById("pageMessage").textContent =
    name === "Dashboard"
      ? ""
      : name + " module is being prepared. Database functions will be connected next.";

  document.querySelectorAll(".nav-btn").forEach(btn => {
    btn.classList.toggle("active", btn.dataset.page === name);
  });
}

document.querySelectorAll(".nav-btn").forEach(btn => {
  btn.addEventListener("click", () => showPage(btn.dataset.page));
});
</script>
</body>
</html>
