
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MobiStock ERP</title>

<style>
*{box-sizing:border-box}
body{
  margin:0;
  padding:20px;
  font-family:Arial,sans-serif;
  background:#f1f5f9;
  color:#1e293b;
}
header{
  background:#1e40af;
  color:white;
  padding:22px;
  border-radius:12px;
  text-align:center;
  margin-bottom:20px;
}
.panel{
  background:white;
  padding:18px;
  margin-bottom:18px;
  border-radius:12px;
  box-shadow:0 2px 8px #00000012;
}
h2{margin-top:0;color:#1e40af}
input,select{
  width:100%;
  padding:12px;
  margin:7px 0 14px;
  border:1px solid #cbd5e1;
  border-radius:7px;
  font-size:16px;
}
button{
  padding:12px 16px;
  border:0;
  border-radius:7px;
  background:#2563eb;
  color:white;
  font-size:15px;
  cursor:pointer;
}
.delete{background:#dc2626;padding:8px 10px}
.stats{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:12px;
}
.stat{
  background:#eff6ff;
  padding:15px;
  border-radius:9px;
}
.stat strong{display:block;font-size:22px;margin-top:7px}
li{
  padding:12px 0;
  border-bottom:1px solid #e2e8f0;
  line-height:1.7;
}
.small{color:#64748b;font-size:13px}
</style>
</head>

<body>

<header>
  <h1>MobiStock ERP</h1>
  <p>Inventory & Sales Management</p>
</header>

<div class="panel">
  <h2>Dashboard</h2>
  <div class="stats">
    <div class="stat">
      Total Products
      <strong id="totalProducts">0</strong>
    </div>
    <div class="stat">
      Stock Value
      <strong id="stockValue">Rs. 0</strong>
    </div>
  </div>
</div>

<div class="panel">
  <h2>Add Product</h2>

  <label>Product Name</label>
  <input id="productName" placeholder="Enter product name">

  <label>Purchase Price (Rs.)</label>
  <input id="purchasePrice" type="number" min="0" placeholder="Purchase price">

  <label>Quantity</label>
  <input id="productQuantity" type="number" min="1" placeholder="Quantity">

  <button onclick="addProduct()">Add Product</button>
</div>

<div class="panel">
  <h2>Inventory</h2>
  <ul id="inventoryList"></ul>
  <p class="small" id="emptyInventory">No products added yet.</p>
</div>

<div class="panel">
  <h2>Sales Order</h2>

  <label>Customer Name</label>
  <input id="customer" placeholder="Customer name">

  <label>Select Product</label>
  <select id="saleProduct">
    <option value="">Select Product</option>
  </select>

  <label>Sale Price (Rs.)</label>
  <input id="salePrice" type="number" min="0" placeholder="Sale price">

  <label>Quantity</label>
  <input id="saleQuantity" type="number" min="1" placeholder="Quantity">

  <button onclick="createOrder()">Create Sales Order</button>
</div>

<div class="panel">
  <h2>Sales History</h2>
  <ul id="salesHistory"></ul>
  <p class="small" id="emptySales">No sales yet.</p>
</div>

<script>
let items = JSON.parse(localStorage.getItem("mobistockItems") || "[]");
let sales = JSON.parse(localStorage.getItem("mobistockSales") || "[]");

function save(){
  localStorage.setItem("mobistockItems", JSON.stringify(items));
  localStorage.setItem("mobistockSales", JSON.stringify(sales));
}

function addProduct(){
  const name = document.getElementById("productName").value.trim();
  const price = Number(document.getElementById("purchasePrice").value);
  const quantity = Number(document.getElementById("productQuantity").value);

  if(!name || price <= 0 || quantity <= 0 ||
     !Number.isInteger(quantity)){
    alert("Please enter valid product details.");
    return;
  }

  items.push({
    name:name,
    price:price,
    quantity:quantity
  });

  save();
  render();

  document.getElementById("productName").value = "";
  document.getElementById("purchasePrice").value = "";
  document.getElementById("productQuantity").value = "";
}

function deleteProduct(index){
  if(!confirm("Delete this product?")) return;

  items.splice(index,1);
  save();
  render();
}

function render(){
  const list = document.getElementById("inventoryList");
  list.innerHTML = "";

  let totalValue = 0;
  let totalProducts = 0;

  items.forEach((item,index)=>{
    const price = Number(item.price ?? item.purchasePrice ?? 0);
    const quantity = Number(item.quantity ?? 0);

    totalValue += price * quantity;
    totalProducts++;

    const li = document.createElement("li");
    li.textContent =
      item.name + " | Purchase: Rs. " + price +
      " | Stock: " + quantity + " ";

    const btn = document.createElement("button");
    btn.textContent = "Delete";
    btn.className = "delete";
    btn.onclick = ()=>deleteProduct(index);

    li.appendChild(btn);
    list.appendChild(li);
  });

  document.getElementById("totalProducts").textContent = totalProducts;
  document.getElementById("stockValue").textContent =
    "Rs. " + totalValue.toLocaleString();

  document.getElementById("emptyInventory").style.display =
    items.length ? "none" : "block";

  loadSaleProducts();
}

function loadSaleProducts(){
  const select = document.getElementById("saleProduct");
  const previousValue = select.value;

  select.innerHTML = '<option value="">Select Product</option>';

  items.forEach((item,index)=>{
    const option = document.createElement("option");
    option.value = index;
    option.textContent = item.name + " (Stock: " + item.quantity + ")";
    select.appendChild(option);
  });

  if(previousValue !== "" && items[Number(previousValue)]){
    select.value = previousValue;
  }
}

function createOrder(){
  const customer = document.getElementById("customer").value.trim();
  const index = document.getElementById("saleProduct").value;
  const price = Number(document.getElementById("salePrice").value);
  const quantity = Number(document.getElementById("saleQuantity").value);

  if(!customer || index === "" || price <= 0 ||
     quantity <= 0 || !Number.isInteger(quantity)){
    alert("Please enter all sales details correctly.");
    return;
  }

  const product = items[Number(index)];

  if(!product || quantity > Number(product.quantity)){
    alert("Not enough stock available!");
    return;
  }

  product.quantity = Number(product.quantity) - quantity;

  sales.push({
    customer:customer,
    product:product.name,
    price:price,
    quantity:quantity,
    date:new Date().toLocaleString()
  });

  save();
  render();
  showSales();

  document.getElementById("customer").value = "";
  document.getElementById("salePrice").value = "";
  document.getElementById("saleQuantity").value = "";
  document.getElementById("saleProduct").value = "";

  alert("Sales Order Created!");
}

function showSales(){
  const list = document.getElementById("salesHistory");
  list.innerHTML = "";

  sales.forEach(sale=>{
    const li = document.createElement("li");
    li.textContent =
      sale.customer + " | " + sale.product +
      " | Qty: " + sale.quantity +
      " | Total: Rs. " + (sale.price * sale.quantity) +
      " | " + sale.date;

    list.appendChild(li);
  });

  document.getElementById("emptySales").style.display =
    sales.length ? "none" : "block";
}

render();
showSales();
</script>

</body>
</html>
