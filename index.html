
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MobiStock ERP</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial;background:#f1f5f9;color:#172033}
header{background:#14213d;color:white;padding:22px}
header h1{margin:0;font-size:25px}
header p{margin:7px 0 0;color:#cbd5e1}
main{padding:18px;max-width:900px;margin:auto}
h2{font-size:20px}
.cards{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.card{background:white;padding:18px;border-radius:12px;box-shadow:0 2px 8px #0001}
.card p{color:#64748b;margin-bottom:5px}
.card strong{font-size:25px}
button{background:#2563eb;color:white;border:0;padding:12px 16px;border-radius:8px;font-size:15px}
input{width:100%;padding:12px;margin:7px 0 14px;border:1px solid #cbd5e1;border-radius:7px}
.panel{background:white;padding:18px;border-radius:12px;margin-top:18px}
#products{padding-left:20px}
</style>
</head>
<body>
<header>
<h1>📱 MobiStock ERP</h1>
<p>Mobile Accessories Management System</p>
</header>
<main>
<h2>Dashboard</h2>
<div class="cards">
<div class="card"><p>Total Products</p><strong id="total">0</strong></div>
<div class="card"><p>Stock Value</p><strong id="value">Rs. 0</strong></div>
</div>
<div class="panel">
<h2>Add New Product</h2>
<input id="name" placeholder="Product name">
<input id="price" type="number" placeholder="Purchase price">
<input id="qty" type="number" placeholder="Quantity">
<button onclick="addProduct()">Add Product</button>
</div>
<div class="panel">
<h2>Products Inventory</h2>
<ul id="products"></ul>
</div>
</main>
<script>
let items=[];
function addProduct(){
let name=document.getElementById('name').value.trim();
let price=Number(document.getElementById('price').value);
let qty=Number(document.getElementById('qty').value);
if(!name||price<=0||qty<=0){alert('Please enter valid product details');return;}
items.push({name,price,qty});
document.getElementById('name').value='';
document.getElementById('price').value='';
document.getElementById('qty').value='';
render();
}
function render(){
document.getElementById('total').textContent=items.length;
document.getElementById('value').textContent='Rs. '+items.reduce((s,p)=>s+p.price*p.qty,0);
document.getElementById('products').innerHTML=items.map(p=>'<li>'+p.name+' — Rs. '+p.price+' × '+p.qty+'</li>').join('');
}
</script>
</body>
</html>
